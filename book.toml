[book]
title = "电子元器件应用技术：基于 OP 放大器与晶体管的放大电路设计"
authors = ["黑田彻"]
language = "zh-CN"
src = "src"

[build]
build-dir = "book"
create-missing = false

[output.html]
mathjax-support = true

[output.pandoc]
optional = true
number-internal-headings = false
list-internal-headings = true

[output.pandoc.profile.pdf]
output-file = "op-amp-internals.pdf"
to = "latex"
pdf-engine = "xelatex"
standalone = true
file-scope = true
table-of-contents = true
toc-depth = 3
top-level-division = "section"
number-sections = false
syntax-highlighting = "tango"
include-in-header = ["print/preamble.tex"]
filters = ["print/heading-math.lua"]

[output.pandoc.profile.pdf.variables]
documentclass = "ctexbook"
classoption = ["fontset=none", "twoside", "openright"]
papersize = "b5"
fontsize = "11pt"
geometry = [
    "inner=23mm",
    "outer=18mm",
    "top=20mm",
    "bottom=24mm",
    "bindingoffset=4mm",
    "headsep=7mm",
    "heightrounded",
]
mainfont = "Times New Roman"
sansfont = "Arial"
monofont = "Cascadia Mono"
CJKmainfont = "SimSun"
CJKsansfont = "Microsoft YaHei"
CJKmonofont = "Microsoft YaHei"
indent = true
linestretch = 1.15
pagestyle = "plain"
colorlinks = true
linkcolor = "black"
urlcolor = "black"
toccolor = "black"
